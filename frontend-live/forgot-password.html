<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta name="theme-color" content="#08a453">
<title>Forgot Password | AmpleMind Technologies</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Yahan aapki wo CSS file link hai jisme aapne code append kiya tha -->
<link rel="stylesheet" href="/static/css/main.0951170b.css">

<style>
  /* Global Reset (if not already in your main.css) */
  body, html {
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    background-color: #f4faf7;
  }

  /* ================= TOAST (Same as Login Page) ================= */
  .toast {
    position: fixed;
    top: 24px; right: 24px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #ffffff;
    padding: 16px 20px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    border-left: 4px solid #078d4b;
    transform: translateX(120%);
    opacity: 0;
    transition: all 0.4s ease;
    width: max-content;
    max-width: 90vw;
  }
  .toast.show { transform: translateX(0); opacity: 1; }
  .toast.error { border-left-color: #e5484d; }
  
  .toast-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #e8faef; color: #078d4b;
    font-weight: 900;
  }
  .toast.error .toast-icon { background: #ffeded; color: #e5484d; }
  .toast-msg { font-size: 14px; font-weight: 600; color: #10243a; }

  /* Spinner Animation */
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  
  @media (max-width: 600px) {
    .toast { top: 16px; right: 16px; left: 16px; width: auto; }
  }
</style>
</head>
<body>

<!-- PREMIUM FORGOT PASSWORD UI -->
<div class="student-container">
  <div class="student-card">
    
    <!-- CSS se automatically ✉ icon aayega -->
    <h2>Forgot Password</h2>
    
    <p>Enter the email address associated with your account and we'll send you an OTP to reset your password.</p>
    
    <form id="forgotForm">
      
      <!-- Email Input -->
      <div class="student-input-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          placeholder="e.g. student@example.com" 
          required 
          autocomplete="email"
        >
      </div>

      <!-- Submit Button -->
      <button type="submit" class="student-btn" id="sendOtpBtn">
        Send OTP
      </button>

    </form>

    <!-- Back to Login -->
    <div class="student-register-link">
      <a href="/student-login">
        <span>←</span> Back to Login
      </a>
    </div>

  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <div class="toast-icon" id="toastIcon">✓</div>
  <div class="toast-msg" id="toastText"></div>
</div>

<!-- SCRIPT -->
<script>
  const API_URL = "https://amplemindtechnologies.com/api/auth/forgot-password";
  const form = document.getElementById("forgotForm");
  const email = document.getElementById("email");
  const sendOtpBtn = document.getElementById("sendOtpBtn");
  
  const toast = document.getElementById("toast");
  const toastIcon = document.getElementById("toastIcon");
  const toastText = document.getElementById("toastText");
  let toastTimer = null;

  function showToast(message, type) {
    clearTimeout(toastTimer);
    toastText.textContent = message;
    if (type === "error") {
      toast.classList.add("error");
      toastIcon.textContent = "!";
    } else {
      toast.classList.remove("error");
      toastIcon.textContent = "✓";
    }
    toast.classList.add("show");
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 3500);
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const emailValue = email.value.trim();
    
    if (!emailValue) {
      showToast("Please enter your registered email address.", "error");
      return;
    }
    
    sendOtpBtn.disabled = true;
    sendOtpBtn.innerHTML = '<span class="spinner"></span> Sending OTP...';
    
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: emailValue })
      });
      
      let data = {};
      try { data = await response.json(); } catch (error) { data = {}; }
      
      if (!response.ok || !data.success) {
        showToast(data.message || "Email not found. Please check and try again.", "error");
        sendOtpBtn.disabled = false;
        sendOtpBtn.innerHTML = "Send OTP";
        return;
      }
      
      // OTP successfully sent
      showToast("OTP sent successfully! Redirecting...", "success");
      
      // Email ko localStorage me save kar lein taki next page (OTP Verification) pe use kar sakein
      localStorage.setItem("resetEmail", emailValue);
      
      setTimeout(() => {
        window.location.href = "/verify-otp"; // Ya jo bhi aapka OTP verification page ka route ho
      }, 1500);
      
    } catch (error) {
      showToast("Unable to connect to server. Please try again later.", "error");
      sendOtpBtn.disabled = false;
      sendOtpBtn.innerHTML = "Send OTP";
    }
  });
</script>

</body>
</html>
